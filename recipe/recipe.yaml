context:
  version: "1.3.0"

package:
  name: libmd
  version: ${{ version }}

source:
  url: https://libbsd.freedesktop.org/releases/libmd-${{ version }}.tar.xz
  sha256: fc0f1eb6b6766470326f2c014693809190e67dba84274a6fbae9d4912d066706

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
  run_exports:
    - ${{ pin_subpackage('libmd') }}

tests:
  - script:
      - test -f ${PREFIX}/lib/libmd${SHLIB_EXT}

about:
  license: BSD-2-Clause
  license_file: COPYING
  summary: Message Digest functions from BSD systems
  homepage: https://www.hadrons.org/software/libmd/

extra:
  recipe-maintainers:
    - danielnachun
